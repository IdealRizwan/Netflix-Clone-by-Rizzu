<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Sign In</title>
     <link
      rel="icon"
      href="/Assets/images/Netflix Logo.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="signin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@300;400;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- BACKGROUND -->
    <div class="bg">
      <div class="overlay"></div>

      <!-- NAVBAR -->
      <header class="navbar">
        <a href="/index.html">
          <img
            src="/Assets/images/Netflix_2015_logo.svg"
            alt="Netflix Logo"
            class="logo"
          />
        </a>
      </header>

      <!-- SIGN IN BOX -->
      <div class="login-box">
        <h2>Sign In</h2>

        <form id="signin-form" novalidate>
          <div class="input-group">
            <input type="email" id="email" placeholder=" " required autocomplete="email" />
            <label for="email">Email or mobile number</label>
            <span class="input-border"></span>
          </div>

          <div class="input-group">
            <input type="password" id="password" placeholder=" " required autocomplete="current-password" />
            <label for="password">Password</label>
            <button type="button" class="toggle-pw" aria-label="Show password">SHOW</button>
            <span class="input-border"></span>
          </div>

          <button type="submit" class="btn-signin">
            <span>Sign In</span>
            <div class="btn-shimmer"></div>
          </button>

          <div class="options">
            <label class="remember">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Remember me
            </label>
            <a href="#" class="help-link">Need help?</a>
          </div>
        </form>

        <div class="divider">
          <span>OR</span>
        </div>

        <button class="btn-code">Use a sign-in code</button>

        <p class="signup">New to Netflix? <a href="#">Sign up now</a></p>

        <p class="captcha">
          This page is protected by Google reCAPTCHA to ensure you're not a bot.
          <a href="#">Learn more</a>.
        </p>
      </div>
    </div>

    <!-- FOOTER -->
    <footer>
      <p class="footer-phone">Questions? Call <a href="tel:0008009191743">000-800-919-1743</a></p>

      <div class="footer-grid">
        <a href="#">FAQ</a>
        <a href="#">Help Centre</a>
        <a href="#">Terms of Use</a>
        <a href="#">Privacy</a>
        <a href="#">Cookie Preferences</a>
        <a href="#">Corporate Information</a>
      </div>

      <select>
        <option>&#127760; English</option>
        <option>&#127760; हिन्दी</option>
      </select>

      <p class="country">Netflix India</p>
    </footer>

  </body>
</html>
